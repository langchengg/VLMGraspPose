model: lavt_one
swin_type: tiny
window12: true
bert: bert-base-uncased
img_size: 480
max_tokens: 20
ocid_version: unique
loss: dice
optimizer: AdamW
lr: 0.00005
weight_decay: 0.01
scheduler: polynomial
polynomial_power: 0.9
epochs: 40
