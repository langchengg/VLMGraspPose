# Normally generated by scripts/discover_data.py. For manual setup, copy this
# file to paths.local.yaml and replace every value with an absolute local path.
ocid_root: /absolute/path/to/OCID-VLG
ocid_api_root: /absolute/path/to/directory/containing/load_ocidvlg.py
ocid_version: unique
hifi_root: /absolute/path/to/HiFi_reproduction
hifi_frozen_train_manifest: /absolute/path/to/ocid_vlg_train.json
hifi_frozen_test_manifest: /absolute/path/to/ocid_vlg_test.json
hifi_prediction_manifest: /absolute/path/to/predictions/export_manifest.json
manifests:
  train: /absolute/path/to/dataset_manifest_train.jsonl
  val: /absolute/path/to/dataset_manifest_val.jsonl
  test: /absolute/path/to/dataset_manifest_test.jsonl
